      <form action="/svar.php" method="GET">
          <label for="enkel">Hvilken aktivitet</label><br>
          <input type="radio" id="enkel" name="aktivitet" value="Enkel aktivitet">
          <label for="enkel">Enkel aktivitet</label>
          <input type="radio" id="fast" name="aktivitet" value="Fast aktivitet">
          <label for="fast">Fast aktivitet</label>

          <br><br>
          
      
          
          <!-- Adresse input, trenger medå vise deres sted, eller velge ett annet sted -->
          
          <label for="dato1">Start og slutt</label> <br>
          <input type="date" id="dato1" name="Start dato">
          <input type="date" id="dato2" name="Slutt dato">
          
          <br><br>
          
          <label for="tidspunkt1">I tidspunktet mellom</label>
          <input type="time" id="tidspunkt1" name="Fra tidspunkt"> og
          <input type="time" id="tidspunkt2" name="Til tidspunkt">
          
          <br><br>
          
          <label for="forkant">Hva må gjøres i forkant</label><br>
          <input type="checkbox" id="påmelding" name="påmelding" value="Påmelding">

          <br><br>
          
          <h3>Valgfritt</h3>
          
          <br><br>
          
          <label for="url">Link til nettside</label><br>
          <input type="url" id="url" name="Link til nettside">
          
          <br><br>
          
          <label for="bilde">Bilde for aktiviteten</label><br>
          <input type="file" id="bilde" name="Bilde">
          
          <br><br>
          
          <label for="lengre_info">Lengre info om aktiviteten</label><br>
          <input type="text" id="lengre_info" size="70" name="Lengre info">
          
          <br><br>
      
          <input type="radio" id="lav" name="aktivitetsnivå" value="Lav aktivitetesnivå">

          <label for="høy">Høy aktivitetsnivå</label>
          
          <br><br>
          
          <input type="radio" id="gratis" name="prisklasse" value="Gratis">

          <input type="radio" id="under200" name="prisklasse" value="Under 200kr">
          <label for="under200">Under 200kr</label><br>
          <input type="radio" id="under500" name="prisklasse" value="Under 500kr">

          <label for="over1000">Over 1000kr</label><br>

          <label for="sluttalder">og</label>
          <input type="text" id="sluttalder" name="sluttalder" size="5">
          
          <br><br>

          <input type="radio" id="utstyr_ja" name="utstyr" value="Trenger utstyr">

          <input type="radio" id="utstyr_nei" name="utstyr" value="Trenger ikke utstyr">

          <input type="checkbox" id="publiser_nå" name="Publiser Nå">
          <label for="publiser_nå">Publiser nå</label>
